[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# A missing hashed asset (old deploy's chunk) must be a real 404, not the SPA
# index.html below — otherwise a stale tab gets HTML where it expects JS.
# Existing files are served first (no `force`), so this only hits misses.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
#
# connect-src must cover the Firebase endpoints the web SDK actually talks to:
#   - firestore.googleapis.com          Firestore REST/streaming
#   - identitytoolkit.googleapis.com    Auth sign-in / signup / action links
#   - securetoken.googleapis.com        ID-token refresh
#   - firebaseinstallations.googleapis.com
#   - *.firebaseio.com (+ wss)          Realtime DB / long-poll fallback
# and the OpenStreetMap tile host used by the Leaflet map in
# src/views/LocationsView.vue (https://{s}.tile.openstreetmap.org/...).
#
# reCAPTCHA v2 on the signup/invite forms (components/ui/RecaptchaCheckbox.vue)
# needs its script + iframe from www.google.com / www.gstatic.com, and the admin
# approval mail (services/notifications.service.ts) posts to api.emailjs.com.
#
# style-src needs 'unsafe-inline': Leaflet positions panes/markers with inline
# style attributes at runtime, so a strict style-src breaks the Locations map.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.tile.openstreetmap.org https://api.emailjs.com; frame-src 'self' https://*.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; manifest-src 'self'"
