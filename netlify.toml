[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
#
# connect-src must cover the Firebase endpoints the web SDK actually talks to:
#   - firestore.googleapis.com          Firestore REST/streaming
#   - identitytoolkit.googleapis.com    Auth sign-in / signup / action links
#   - securetoken.googleapis.com        ID-token refresh
#   - firebaseinstallations.googleapis.com
#   - *.firebaseio.com (+ wss)          Realtime DB / long-poll fallback
# and the OpenStreetMap tile host used by the Leaflet map in
# src/views/LocationsView.vue (https://{s}.tile.openstreetmap.org/...).
#
# style-src needs 'unsafe-inline': Leaflet positions panes/markers with inline
# style attributes at runtime, so a strict style-src breaks the Locations map.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.tile.openstreetmap.org; frame-src 'self' https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'"
